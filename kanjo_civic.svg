<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
    <defs>
        <!-- Gradients & Shadows -->
        <linearGradient id="groundShadow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1A2530"/>
            <stop offset="70%" stop-color="#2D3E50"/>
            <stop offset="100%" stop-color="#141E28"/>
        </linearGradient>
        <clipPath id="bodyClip">
            <path d="M 120 290 L 135 265 L 210 245 L 320 240 L 400 170 L 680 170 L 730 200 L 790 265 L 785 295 L 745 295 C 715 235 625 235 595 295 L 345 295 C 315 235 225 235 190 295 L 120 295 Z"/>
        </clipPath>
    </defs>

    <!-- Studio / Track Backdrop -->
    <rect width="100%" height="100%" fill="#141417"/>
    <line x1="0" y1="345" x2="1000" y2="345" stroke="#252528" stroke-width="2"/>

    <!-- Ground Contact Shadow -->
    <ellipse cx="500" cy="350" rx="440" ry="18" fill="url(#groundShadow)"/>

    <!-- GT Wing (Rear) -->
    <path d='M 675 168 L 735 150 L 755 155 L 685 172' fill='#0A0A0A' stroke='#222' stroke-width='2'/>

    <!-- BASE CAR BODY (Clipped for liveries) -->
    <g id="car_assembly">
        <!-- Main Painted Shell -->
        <path d="M 120 290 L 135 265 L 210 245 L 320 240 L 400 170 L 680 170 L 730 200 L 790 265 L 785 295 L 745 295 C 715 235 625 235 595 295 L 345 295 C 315 235 225 235 190 295 L 120 295 Z" fill="#80C29A" stroke="#1A1A1A" stroke-width="3"/>

        <!-- Livery Graphics (Clipped to body) -->
        <g clip-path="url(#bodyClip)">
            
        <g id="livery_kanjo">
            <!-- White Door Meatball -->
            <circle cx="520" cy="235" r="45" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
            <text x="520" y="252" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="bold" fill="#111111" text-anchor="middle">96</text>
            <!-- Rocker Decal Strip -->
            <rect x="350" y="275" width="280" height="15" fill="#111111"/>
            <text x="490" y="286" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TEMPLE RACING 浪花環状</text>
        </g>
        

            <!-- Mid-Door Title Sponsor Billboard -->
            <g transform="translate(510, 248)">
                <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" 
                      fill="#FFFFFF" stroke="#000000" stroke-width="2" text-anchor="middle" letter-spacing="1">
                    KURONEKO
                </text>
                <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="bold" 
                      fill="#FFD700" text-anchor="middle" letter-spacing="3">
                    YAMATO
                </text>
            </g>

            <!-- Tier 3 Vertical Sponsor Stack (Front Fender) -->
            <g transform="translate(345, 235)" font-family="sans-serif" font-size="7" font-weight="900" fill="#FFFFFF">
                <text x="0" y="0">NISMO</text>
                <text x="0" y="9">TEIN</text>
                <text x="0" y="18">ENDLESS</text>
                <text x="0" y="27">RAYS</text>
                <text x="0" y="36">MOTUL</text>
            </g>

            <!-- Competition Number Box (If not kanjo meatball) -->
            

            <!-- Scrutineering Details: Tow Hook Arrow -->
            <g transform="translate(130, 280)">
                <polygon points="0,0 8,4 0,8" fill="#FF1744"/>
                <text x="11" y="6" font-family="monospace" font-size="6" font-weight="bold" fill="#FF1744">TOW</text>
            </g>
        </g>

        <!-- Cabin Greenhouse / Windows -->
        <path d="M 405 175 L 675 175 L 725 205 L 760 255 L 330 240 Z" fill="url(#glassGradient)" stroke="#111111" stroke-width="2.5"/>

        <!-- A/B/C Pillars & Door Cutlines -->
        <path d="M 410 180 L 400 290 M 620 180 L 610 290" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>

        <!-- Aerodynamic Lower Rocker Splitter -->
        <path d="M 110 295 L 900 295 L 890 302 L 115 302 Z" fill="#080808"/>

        <!-- Headlight & Taillight Units -->
        <path d="M 140 260 L 195 250 L 185 265 Z" fill="#FFFDE7" stroke="#333" stroke-width="1"/>
        <path d="M 770 255 L 785 268 L 768 275 Z" fill="#D50000" stroke="#333" stroke-width="1"/>
    </g>

    <!-- Wheels (Drawn above body) -->
    
    <!-- Wheel Assembly at (270, 295) -->
    <g class="wheel">
        <!-- Rubber Tire -->
        <circle cx="270" cy="295" r="64" fill="#18181A" stroke="#0D0D0F" stroke-width="4"/>
        <circle cx="270" cy="295" r="54" fill="none" stroke="#252528" stroke-width="1.5" stroke-dasharray="8 4"/>
        <!-- Tire Lettering Stencil -->
        <path id="tire_curve_270" d="M 214 295 A 56 56 0 0 1 326 295" fill="none"/>
        <text font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#F0F0F0" letter-spacing="2">
            <textPath href="#tire_curve_270" startOffset="50%" text-anchor="middle">
                TOYO TIRES
            </textPath>
        </text>
        <!-- Rim Outer Lip -->
        <circle cx="270" cy="295" r="48" fill="#111111" stroke="#444444" stroke-width="2.5"/>
        <circle cx="270" cy="295" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <circle cx="270" cy="295" r="36" fill="#0A0A0A"/>
    
        <circle cx="270" cy="295" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 2"/>
        <circle cx="270" cy="295" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"/>
        <circle cx="270" cy="295" r="9" fill="#000" stroke="#FFD700" stroke-width="1.5"/>
        <text x="270" y="298" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFD700" text-anchor="middle">BBS</text>
        </g>

    
    <!-- Wheel Assembly at (670, 295) -->
    <g class="wheel">
        <!-- Rubber Tire -->
        <circle cx="670" cy="295" r="64" fill="#18181A" stroke="#0D0D0F" stroke-width="4"/>
        <circle cx="670" cy="295" r="54" fill="none" stroke="#252528" stroke-width="1.5" stroke-dasharray="8 4"/>
        <!-- Tire Lettering Stencil -->
        <path id="tire_curve_670" d="M 614 295 A 56 56 0 0 1 726 295" fill="none"/>
        <text font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#F0F0F0" letter-spacing="2">
            <textPath href="#tire_curve_670" startOffset="50%" text-anchor="middle">
                TOYO TIRES
            </textPath>
        </text>
        <!-- Rim Outer Lip -->
        <circle cx="670" cy="295" r="48" fill="#111111" stroke="#444444" stroke-width="2.5"/>
        <circle cx="670" cy="295" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <circle cx="670" cy="295" r="36" fill="#0A0A0A"/>
    
        <circle cx="670" cy="295" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 2"/>
        <circle cx="670" cy="295" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"/>
        <circle cx="670" cy="295" r="9" fill="#000" stroke="#FFD700" stroke-width="1.5"/>
        <text x="670" y="298" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFD700" text-anchor="middle">BBS</text>
        </g>


    <!-- Spec Banner Header -->
    <text x="30" y="40" font-family="'Impact', sans-serif" font-size="20" fill="#E0E0E0" letter-spacing="1">
        CAR LIVERY CREATOR // HONDA CIVIC (EG6 HATCHBACK)
    </text>
    <text x="30" y="60" font-family="monospace" font-size="11" fill="#888888">
        STYLE: KANJO_MEATBALL | BASE: #80C29A | ACCENT: #FFD700 | SPONSOR: KURONEKO #96
    </text>
</svg>