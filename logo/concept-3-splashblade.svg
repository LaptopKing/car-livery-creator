<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Car Livery Creator - HKS Velocity Splashblade</title>
  <defs>
    <filter id="magentaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007F" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Street Shield Canvas -->
  <g transform="translate(128, 128)">
    <!-- Stealth Octagonal Racing Badge Perimeter -->
    <polygon points="-110,-45 -45,-110 45,-110 110,-45 110,45 45,110 -45,110 -110,45" fill="#0D0D12" stroke="#23232F" stroke-width="4"/>

    <!-- Kinetic Drift Shards / Aerodynamic Splashblades (38° Rake Angle) -->
    <g transform="rotate(-10)">
      <!-- Main Violet Graphic Mass (HKS Legacy) -->
      <polygon points="-80,80 -20,80 70,-70 10,-70" fill="#7B1FA2"/>
      <polygon points="-50,90 10,90 90,-40 30,-40" fill="#9C27B0"/>

      <!-- Electric Cyan Velocity Scallop -->
      <polygon points="-30,60 30,60 100,-50 40,-50" fill="#00E5FF"/>
      <polygon points="10,40 50,40 105,-30 65,-30" fill="#80F2FF"/>

      <!-- High-Energy Acid Magenta Razor Fang -->
      <polygon points="-10,20 40,20 112,-80 62,-80" fill="#FF007F" filter="url(#magentaGlow)"/>

      <!-- Trailing Aerodynamic Splash Specks / Drift Grime Particles -->
      <polygon points="-65,-20 -50,-20 -35,-42 -50,-42" fill="#00E5FF"/>
      <polygon points="-90,10 -80,10 -68,-6 -78,-6" fill="#FF007F"/>
      <polygon points="-75,40 -65,40 -55,26 -65,26" fill="#FFFFFF"/>
      <circle cx="85" cy="40" r="5" fill="#FFE600"/>
      <circle cx="98" cy="20" r="3" fill="#00E5FF"/>
    </g>

    <!-- Japanese Katakana Stamp Badge 「リバリー」 (Livery) -->
    <g transform="translate(-85, 78)">
      <rect width="64" height="18" fill="#FF007F" rx="2"/>
      <text x="32" y="13" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
        リバリー
      </text>
    </g>

    <!-- Racing Division Code -->
    <text x="35" y="92" font-family="monospace" font-size="10" font-weight="900" fill="#00E5FF" letter-spacing="2">
      DRIFT//01
    </text>
  </g>
</svg>
