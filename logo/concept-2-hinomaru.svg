<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Car Livery Creator - Neo-Hinomaru Street Meatball</title>
  <defs>
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F0FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Street Shield Canvas -->
  <g transform="translate(128, 128)">
    <!-- Heavy Industrial Rim with 6 Rivets / Lugs -->
    <circle cx="0" cy="0" r="120" fill="#0E1017" stroke="#252A38" stroke-width="5"/>
    <!-- 6 Bolted Rivets (Widebody Overfender Hardware) -->
    <circle cx="0" cy="-108" r="4.5" fill="#4B5568"/>
    <circle cx="94" cy="-54" r="4.5" fill="#4B5568"/>
    <circle cx="94" cy="54" r="4.5" fill="#4B5568"/>
    <circle cx="0" cy="108" r="4.5" fill="#4B5568"/>
    <circle cx="-94" cy="54" r="4.5" fill="#4B5568"/>
    <circle cx="-94" cy="-54" r="4.5" fill="#4B5568"/>

    <!-- The Saturated Hinomaru Red Sun Core -->
    <circle cx="0" cy="0" r="96" fill="#E60012"/>

    <!-- High-Voltage 35° Velocity Lightning / Razor Slashes (Kaido Racer Style) -->
    <!-- Slash 1: Upper Razor Blade (Pure White) -->
    <polygon points="-88,-32 44,-96 92,-96 -40,-32" fill="#FFFFFF"/>
    <!-- Slash 2: Main Speed Channel (Deep Obsidian Void) -->
    <polygon points="-98,12 28,-62 76,-62 -50,12" fill="#0E1017"/>
    <!-- Slash 3: Electric Cyan Discharge Stripe -->
    <polygon points="-90,44 14,-18 36,-18 -68,44" fill="#00F0FF" filter="url(#neonCyanGlow)"/>

    <!-- Stencil Kanji Stamp "走" (Hashiriya / Street Runner Spirit) -->
    <circle cx="-28" cy="44" r="34" fill="#0E1017" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-28" y="56" font-family="'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      壱
    </text>

    <!-- Technical Stencil Marks -->
    <text x="36" y="66" font-family="monospace" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      LIVERY//GT
    </text>
  </g>
</svg>
