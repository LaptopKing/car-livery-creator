<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256">
  <!-- Concept 3 Lockup: Velocity Wrap Stripes -->
  <rect width="100%" height="100%" fill="#0A0C10" rx="14"/>
  <rect x="0" y="248" width="960" height="8" fill="#FF5500" rx="2"/>

  <!-- Symbol Left -->
  <g transform="translate(136, 128) scale(0.85)">
    <circle cx="0" cy="0" r="114" fill="#0E1017" stroke="#222735" stroke-width="4"/>
    <path d="M -70,74 C -20,40 20,-10 44,-84 L 80,-84 C 54,-4 10,54 -38,74 Z" fill="#FF5500"/>
    <path d="M -90,44 C -40,10 0,-40 24,-114 L 46,-114 C 20,-34 -20,24 -68,44 Z" fill="#FFFFFF"/>
    <path d="M -106,12 C -60,-18 -20,-70 4,-114 L 18,-114 C -6,-64 -44,-10 -92,12 Z" fill="#4A5568"/>
    <polygon points="-78,92 78,92 68,102 -68,102" fill="#FF5500"/>
    <line x1="-114" y1="0" x2="-98" y2="0" stroke="#FF5500" stroke-width="2.5"/>
    <line x1="98" y1="0" x2="114" y2="0" stroke="#FF5500" stroke-width="2.5"/>
    <line x1="0" y1="-114" x2="0" y2="-98" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="0" y1="98" x2="0" y2="114" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(268, 0)">
    <!-- Overhead Tag -->
    <text x="4" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FF5500" letter-spacing="4">
