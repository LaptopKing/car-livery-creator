    </text>

    <!-- Orange Accent Block -->
    <g transform="translate(4, 154)">
      <polygon points="0,0 230,0 210,38 0,38" fill="#FF5500"/>
      <text x="14" y="27" font-family="'Arial Black', sans-serif" font-size="22" font-style="italic" font-weight="900" fill="#FFFFFF" letter-spacing="8">
        CREATOR
      </text>
      <!-- White accent -->
      <polygon points="222,0 234,0 220,38 208,38" fill="#FFFFFF"/>
    </g>

    <text x="264" y="180" font-family="sans-serif" font-size="12" font-weight="800" fill="#7E8597" letter-spacing="3">
