<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Car Livery Creator - Aero Shuriken Mark</title>
  <defs>
    <filter id="streetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#DE0029" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Concept 1: The Aero Shuriken (D1GP & Kanjo Street Vortex) -->
  <g transform="translate(128, 128)">
    <!-- Outer Kinetic Vortex Ring Guide (Street Badge Circle) -->
    <circle cx="0" cy="0" r="118" fill="#0D0E12" stroke="#22252E" stroke-width="4"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#DE0029" stroke-width="2" stroke-dasharray="16 8"/>

    <!-- 4 High-Velocity Aero Shuriken Blades (30° Rake) -->
    <g filter="url(#streetGlow)">
      <!-- Top Blade (Crimson Attack) -->
      <polygon points="0,-16 28,-16 72,-96 16,-96" fill="#DE0029"/>
      <!-- Stepped Speed Notch -->
      <polygon points="28,-36 44,-36 72,-96 56,-96" fill="#FF2E4D"/>

      <!-- Right Blade (Jet Black Stealth) -->
      <polygon points="16,0 16,28 96,72 96,16" fill="#1A1C23" stroke="#333745" stroke-width="1.5"/>
      <polygon points="36,28 36,44 96,72 96,56" fill="#2E3342"/>

      <!-- Bottom Blade (Crimson Attack) -->
      <polygon points="0,16 -28,16 -72,96 -16,96" fill="#DE0029"/>
      <polygon points="-28,36 -44,36 -72,96 -56,96" fill="#FF2E4D"/>

      <!-- Left Blade (Arctic White Aerofoil) -->
      <polygon points="-16,0 -16,-28 -96,-72 -96,-16" fill="#F4F5F7"/>
      <polygon points="-36,-28 -36,-44 -96,-72 -96,-56" fill="#FFFFFF"/>
    </g>

    <!-- Center Negative Space Diamond & High-Vis Apex Pin -->
    <polygon points="0,-22 22,0 0,22 -22,0" fill="#0D0E12" stroke="#FFE600" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#FFE600"/>

    <!-- Scrutineering Alignment Hash Marks -->
    <line x1="-118" y1="0" x2="-102" y2="0" stroke="#FFE600" stroke-width="3"/>
    <line x1="102" y1="0" x2="118" y2="0" stroke="#FFE600" stroke-width="3"/>
    <line x1="0" y1="-118" x2="0" y2="-102" stroke="#DE0029" stroke-width="3"/>
    <line x1="0" y1="102" x2="0" y2="118" stroke="#DE0029" stroke-width="3"/>
  </g>
</svg>
